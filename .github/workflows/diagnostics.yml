name: Diagnostics

# Read-only checks, run by hand from the Actions tab. Changes nothing.
#  - Shows what a retailer's site returns, for debugging a retailer whose
#    listings all fail to refresh.
#  - Lists tracked listings that probably belong to a different fragrance
#    (download "listing-mismatches" from the run's Artifacts to review).

on:
  workflow_dispatch:
    inputs:
      retailer:
        description: 'Retailer key to probe (e.g. venba)'
        type: string
        default: 'venba'

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: scraper
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      NODE_ENV: production
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: scraper/package-lock.json

      - run: npm ci --include=dev

      - name: Probe retailer
        continue-on-error: true
        env:
          RETAILER: ${{ inputs.retailer }}
        run: npm run diagnose -- "$RETAILER"

      - name: Report listings filed under the wrong fragrance
        run: npm run report-mismatches -- listing-mismatches.csv

      - uses: actions/upload-artifact@v4
        with:
          name: listing-mismatches
          path: scraper/listing-mismatches.csv
