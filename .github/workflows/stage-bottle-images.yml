name: Bottle photos

# Builds a consistent product photo for each fragrance (the bottle cut out of
# a retailer photo and placed on the shared marble backdrop) and commits them
# to web/public/bottles, which redeploys the site with the new photos.
#
# Weekly it only does fragrances that don't have a photo yet. Run it by hand
# with "redo all" to rebuild every photo (e.g. after changing the backdrop).

on:
  schedule:
    - cron: '41 9 * * 0' # Sundays
  workflow_dispatch:
    inputs:
      redo_all:
        description: 'Rebuild photos for every fragrance, not just new ones'
        type: boolean
        default: false
      limit:
        description: 'Only process this many fragrances (blank = all)'
        type: string
        default: ''

concurrency:
  group: stage-bottle-images
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  stage:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: scraper/images/requirements.txt

      - name: Cache background-removal model
        uses: actions/cache@v4
        with:
          path: ~/.rembg
          key: rembg-u2net-v1

      - run: pip install -r scraper/images/requirements.txt

      - name: Build bottle photos
        env:
          REDO_ALL: ${{ inputs.redo_all }}
          LIMIT: ${{ inputs.limit }}
        run: |
          args="--max-minutes 300"
          if [ "$REDO_ALL" = "true" ]; then args="$args --all"; fi
          if [[ "$LIMIT" =~ ^[0-9]+$ ]]; then args="$args --limit $LIMIT"; fi
          python scraper/images/stage_bottles.py $args

      - name: Commit new photos
        # Also after a failure part-way through: keep whatever was finished
        if: success() || failure()
        run: |
          git add web/public/bottles web/lib/staged-bottles.json
          if git diff --cached --quiet; then
            echo "No new photos."
            exit 0
          fi
          count=$(git diff --cached --name-only --diff-filter=A -- web/public/bottles | wc -l)
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update bottle photos ($count new)"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
